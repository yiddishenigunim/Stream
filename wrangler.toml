# Cloudflare Workers Builds deploys this Worker automatically on every push to
# main. Before this file existed the Worker was pasted into the dashboard by
# hand; connecting the repo to Git without it produced deploys that could not
# work, because nothing here told wrangler which file was the Worker.
#
# Every key below is load-bearing. In particular, wrangler treats this file as
# the full description of the Worker: anything configured in the dashboard but
# missing here is REMOVED on deploy. That is how a deploy can take the whole
# API down while reporting success.

name = "nigunim-api"
main = "manage/worker.js"
compatibility_date = "2025-01-01"

# The *.workers.dev URL, which stays enabled.
workers_dev = true

# Both hostnames the Worker already answers on. Declared so each deploy
# re-asserts them instead of depending on dashboard state — stream-api is the
# one the website and /manage call, so losing it breaks the site.
routes = [
  { pattern = "stream-api.oitzerhanigunim.org", custom_domain = true },
  { pattern = "nigunim-api.oitzerhanigunim.org", custom_domain = true },
]

# The R2 bucket holding every nigun. `binding` is the name the code reads
# (env.BUCKET in manage/worker.js); `bucket_name` is the real bucket in R2.
# They are not the same string and the difference matters: a wrong bucket_name
# deploys cleanly and only then fails, with env.BUCKET pointing at nothing.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "stream"

# The Worker logs a tagged line per request (see the `[${requestId}]` calls in
# manage/worker.js). Keep those queryable in the dashboard.
[observability]
enabled = true
