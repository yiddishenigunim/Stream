# Cloudflare Worker config for the management API.
#
# Deploy with:  npx wrangler deploy
# (Run `npx wrangler login` first if you haven't authenticated.)

name = "manage-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# Bind the SAME R2 bucket the streaming site reads from.
# Replace `bucket_name` with your real bucket name (find it in the
# Cloudflare dashboard → R2, or in the existing stream-api worker config).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "REPLACE_WITH_YOUR_R2_BUCKET_NAME"

# ── Custom domain route ──────────────────────────────────────────────
# Point the worker at manage-api.oitzerhanigunim.org so the /manage page
# can reach it with its default MANAGE_API value. Requires the zone
# oitzerhanigunim.org to be on this Cloudflare account.
#
# routes = [
#   { pattern = "manage-api.oitzerhanigunim.org", custom_domain = true }
# ]
#
# Alternatively, deploy without a route and use the workers.dev URL it
# prints — then open the page as /manage?api=https://manage-api.<you>.workers.dev
# (or set localStorage 'manage_api' to that URL once).

# ── Optional real auth ───────────────────────────────────────────────
# The /manage page uses a client-side PIN only. If you later want the API
# itself protected, add a secret and send it from the page:
#   npx wrangler secret put ADMIN_TOKEN
# The worker then requires  Authorization: Bearer <token>  on writes.
