<!DOCTYPE html>
<html lang="yi" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>פארוואלטונג — חסידישע ניגונים</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18V5l12-2v13'></path><circle cx='6' cy='18' r='3'></circle><circle cx='18' cy='16' r='3'></circle></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold-light: #fbe6ad;
            --gold: #d4af37;
            --gold-dark: #aa841c;
            --navy-dark: #070e1b;
            --navy: #0e1d35;
            --navy-light: #182e50;
            --cream: #faf6eb;
            --glass-bg: rgba(14, 29, 53, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --danger: #e0556a;
            --ok: #43b581;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #050c18 0%, #0c182b 50%, #152744 100%);
            min-height: 100vh;
            color: var(--cream);
            overflow-x: hidden;
            position: relative;
        }

        /* Glowing background orbs — same language as the main page */
        .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.13; mix-blend-mode: screen; animation: floatOrb 25s infinite alternate ease-in-out; }
        .orb-1 { width: 450px; height: 450px; background-color: var(--gold); top: -10%; left: -10%; animation-duration: 22s; }
        .orb-2 { width: 550px; height: 550px; background-color: #8b3a42; bottom: -15%; right: -10%; animation-duration: 28s; animation-delay: -5s; }
        .orb-3 { width: 350px; height: 350px; background-color: #4a3a6a; top: 45%; left: 50%; animation-duration: 25s; animation-delay: -10s; }
        @keyframes floatOrb { 0% { transform: translate(0,0) scale(1);} 50% { transform: translate(80px,-60px) scale(1.15);} 100% { transform: translate(-50px,70px) scale(0.9);} }

        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(212,175,55,0.05) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(114,47,55,0.05) 0%, transparent 60%);
        }

        .container { position: relative; z-index: 1; max-width: 1150px; margin: 0 auto; padding: 0 18px 40px; min-height: 100vh; display: flex; flex-direction: column; }

        /* Header — mirrors the main page */
        .header { padding: 34px 10px 20px; text-align: center; }
        .header h1 {
            font-size: 2.5em; font-weight: 700; letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 10%, var(--gold-light) 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
        }
        .header .subtitle { font-size: 1.05em; color: var(--cream); opacity: 0.72; margin-top: 6px; }
        .header::after { content: ''; display: block; margin: 16px auto 0; width: 150px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent); opacity: 0.5; }

        /* Glass panel */
        .panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 22px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.28); padding: 18px 20px; margin-top: 14px;
        }

        /* Breadcrumb */
        .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 1.05em; }
        .crumb { background: none; border: none; color: var(--gold-light); cursor: pointer; font-family: inherit; font-size: 1em;
            padding: 4px 8px; border-radius: 10px; transition: background 0.2s; font-weight: 600; }
        .crumb:hover { background: rgba(255,255,255,0.06); }
        .crumb.current { color: var(--cream); cursor: default; }
        .crumb-sep { opacity: 0.45; }

        /* Toolbar */
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
        .tool-btn {
            display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 12px;
            border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--cream);
            font-family: inherit; font-size: 0.92em; font-weight: 600; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
        }
        .tool-btn:hover:not(:disabled) { border-color: rgba(212,175,55,0.4); background: rgba(255,255,255,0.09); transform: translateY(-2px); }
        .tool-btn:active:not(:disabled) { transform: translateY(0); }
        .tool-btn:disabled { opacity: 0.38; cursor: not-allowed; }
        .tool-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .tool-btn.primary { border-color: var(--gold); background: linear-gradient(135deg, rgba(212,175,55,0.28), rgba(212,175,55,0.08)); color: var(--gold-light); }
        .tool-btn.danger { color: #ffd7dd; }
        .tool-btn.danger:hover:not(:disabled) { border-color: var(--danger); background: rgba(224,85,106,0.16); }
        .tool-kbd { font-size: 0.72em; opacity: 0.55; font-family: 'Outfit', sans-serif; }

        .toolbar-spacer { flex: 1 1 auto; }

        .search-box { position: relative; display: flex; align-items: center; }
        .search-box input {
            background: rgba(0,0,0,0.25); border: 1px solid var(--glass-border); border-radius: 12px;
            color: var(--cream); font-family: inherit; font-size: 0.92em; padding: 9px 34px 9px 14px; width: 200px;
            transition: border-color 0.2s, width 0.2s;
        }
        .search-box input:focus { outline: none; border-color: rgba(212,175,55,0.5); width: 230px; }
        .search-box .search-ic { position: absolute; inset-inline-end: 11px; opacity: 0.5; pointer-events: none; }

        /* Selection info bar */
        .selbar { display: flex; align-items: center; gap: 14px; margin-top: 14px; font-size: 0.92em; min-height: 22px; flex-wrap: wrap; }
        .selbar .count { color: var(--gold-light); font-weight: 700; }
        .selbar .clip { opacity: 0.8; }
        .selbar .clip b { color: var(--gold-light); }
        .selbar .muted { opacity: 0.6; }

        /* Folders */
        .folders { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .folder-chip {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px;
            border: 1px solid var(--glass-border); background: rgba(255,255,255,0.035); cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16,1,0.3,1); font-size: 0.95em; font-weight: 600; color: var(--cream); position: relative;
        }
        .folder-chip:hover { border-color: rgba(212,175,55,0.4); background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .folder-chip .fi { color: var(--gold); display: flex; }
        .folder-chip .fi svg { width: 20px; height: 20px; }
        .folder-chip.drop-target { border-color: var(--gold); background: rgba(212,175,55,0.18); }
        .folder-del {
            border: none; background: rgba(0,0,0,0.3); color: #ffd7dd; width: 20px; height: 20px; border-radius: 50%;
            cursor: pointer; font-size: 0.8em; line-height: 1; display: none; align-items: center; justify-content: center; margin-inline-start: 2px;
        }
        .folder-chip:hover .folder-del { display: flex; }
        .folder-del:hover { background: var(--danger); color: #fff; }

        /* File list (virtualized) */
        .list-head { display: flex; align-items: center; gap: 12px; padding: 6px 14px; margin-top: 14px;
            font-size: 0.8em; opacity: 0.6; letter-spacing: 0.5px; text-transform: uppercase; }
        .list-head .h-name { flex: 1; }
        .list-head .h-size { width: 90px; text-align: start; }
        .list-head .h-act { width: 34px; }

        #file-list {
            position: relative; margin-top: 4px; height: 56vh; min-height: 260px; overflow-y: auto; overflow-x: hidden;
            border: 1px solid var(--glass-border); border-radius: 16px; background: rgba(0,0,0,0.18);
        }
        #file-list.dragover { border-color: var(--gold); background: rgba(212,175,55,0.10); }
        #list-spacer { position: relative; width: 100%; }
        #list-rows { position: absolute; inset: 0; }

        .frow {
            position: absolute; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 12px;
            padding: 0 14px; cursor: pointer; user-select: none;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .frow:hover { background: rgba(255,255,255,0.045); }
        .frow.selected { background: rgba(212,175,55,0.15); }
        .frow.selected:hover { background: rgba(212,175,55,0.2); }
        .fcheck {
            width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center; font-size: 0.8em; color: var(--navy-dark);
            flex: 0 0 auto; transition: background 0.15s, border-color 0.15s;
        }
        .frow.selected .fcheck { background: var(--gold); border-color: var(--gold); }
        .fname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.96em; }
        .fsize { width: 90px; text-align: start; font-size: 0.82em; opacity: 0.65; font-family: 'Outfit', sans-serif; }
        .frow-del {
            width: 26px; height: 26px; border-radius: 8px; border: none; background: rgba(255,255,255,0.05);
            color: #ffb3bd; cursor: pointer; font-size: 0.85em; display: flex; align-items: center; justify-content: center;
            flex: 0 0 auto; opacity: 0; transition: opacity 0.15s, background 0.15s;
        }
        .frow:hover .frow-del { opacity: 1; }
        .frow-del:hover { background: var(--danger); color: #fff; }

        .empty-state { padding: 46px 20px; text-align: center; opacity: 0.55; font-size: 1.05em; }
        .empty-state small { display: block; margin-top: 8px; opacity: 0.8; font-size: 0.8em; }

        /* Status / error strip */
        .statusbar { margin-top: 12px; min-height: 20px; font-size: 0.9em; display: flex; align-items: center; gap: 10px; }
        .statusbar .err { color: #ffb3bd; }
        .statusbar .busy { color: var(--gold-light); }
        .spinner { width: 15px; height: 15px; border: 2px solid rgba(212,175,55,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Upload progress panel */
        #progress-panel {
            position: fixed; inset-inline-end: 20px; bottom: 20px; width: min(360px, calc(100vw - 40px));
            background: rgba(10,20,38,0.94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,0.55);
            z-index: 50; padding: 14px 16px; display: none;
        }
        #progress-panel.show { display: block; }
        .pp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .pp-title { font-weight: 700; color: var(--gold-light); font-size: 0.98em; }
        .pp-close { background: none; border: none; color: var(--cream); opacity: 0.6; cursor: pointer; font-size: 1.1em; }
        .pp-close:hover { opacity: 1; }
        .pp-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .pp-item { font-size: 0.82em; }
        .pp-item .pp-name { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
        .pp-item .pp-name span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pp-item .pp-pct { opacity: 0.7; font-family: 'Outfit', sans-serif; flex: 0 0 auto; }
        .pp-bar { height: 5px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
        .pp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold-dark), var(--gold-light)); transition: width 0.15s; }
        .pp-item.done .pp-fill { background: linear-gradient(90deg, #2f7d5b, var(--ok)); }
        .pp-item.error .pp-fill { background: linear-gradient(90deg, #8b2b38, var(--danger)); width: 100% !important; }
        .pp-item.error .pp-pct { color: #ffb3bd; }
        .pp-foot { margin-top: 10px; font-size: 0.8em; opacity: 0.75; text-align: center; }

        /* PIN overlay */
        #pin-overlay {
            position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
            background: rgba(5,12,24,0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .pin-box {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212,175,55,0.35); border-radius: 24px; padding: 36px 40px; text-align: center;
            width: 380px; max-width: 90vw; box-shadow: 0 20px 55px rgba(0,0,0,0.55), 0 0 30px rgba(212,175,55,0.18);
        }
        .pin-box .lock { color: var(--gold); margin-bottom: 12px; }
        .pin-box h2 { color: var(--gold-light); font-size: 1.4em; margin-bottom: 6px; }
        .pin-box p { opacity: 0.72; font-size: 0.95em; margin-bottom: 20px; }
        .pin-box input {
            width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.3); color: var(--cream); font-family: inherit; font-size: 1.05em; text-align: center;
        }
        .pin-box input:focus { outline: none; border-color: var(--gold); }
        .pin-box button {
            margin-top: 16px; width: 100%; padding: 13px; border: none; border-radius: 14px; cursor: pointer;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--navy-dark);
            font-family: inherit; font-size: 1.05em; font-weight: 700; transition: transform 0.2s, box-shadow 0.2s;
        }
        .pin-box button:hover { transform: scale(1.03); box-shadow: 0 6px 20px rgba(212,175,55,0.35); }
        .pin-err { color: #ffb3bd; font-size: 0.9em; margin-top: 12px; min-height: 18px; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-9px);} 40%,80%{transform:translateX(9px);} }

        .config-note {
            margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 0.85em; line-height: 1.6;
            background: rgba(224,85,106,0.10); border: 1px solid rgba(224,85,106,0.3); color: #ffd7dd;
        }
        .config-note code { background: rgba(0,0,0,0.35); padding: 1px 6px; border-radius: 5px; font-size: 0.92em; }

        @media (max-width: 620px) {
            .header h1 { font-size: 2em; }
            .search-box input, .search-box input:focus { width: 100%; }
            .search-box { flex: 1 1 100%; }
            .toolbar-spacer { display: none; }
            .fsize { display: none; }
            #file-list { height: 52vh; }
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- PIN gate — asked on every visit -->
    <div id="pin-overlay">
        <form class="pin-box" id="pin-form" autocomplete="off">
            <div class="lock">
                <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2>פארוואלטונג</h2>
            <p>ביטע לייגט אריין דעם PIN צו קומען אריין</p>
            <input type="password" id="pin-input" placeholder="PIN" autocomplete="off" autofocus inputmode="text">
            <button type="submit">אריין</button>
            <div class="pin-err" id="pin-err"></div>
        </form>
    </div>

    <div class="container" id="app" hidden>
        <div class="header">
            <h1>פארוואלטונג</h1>
            <p class="subtitle">צולייגן און אויסמעקן פיילס אין יעדן פאלדער</p>
        </div>

        <div class="panel">
            <div class="breadcrumb" id="breadcrumb"></div>

            <div class="toolbar">
                <button class="tool-btn primary" id="btn-upload" title="אַרויפלייגן פיילס">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    אַרויפלייגן
                </button>
                <button class="tool-btn" id="btn-newfolder" title="נייע פאלדער">
                    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
                    נייע פאלדער
                </button>
                <button class="tool-btn" id="btn-selectall" title="סעלעקט אלע (Ctrl+A)">
                    <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    סעלעקט אלע <span class="tool-kbd">Ctrl+A</span>
                </button>
                <button class="tool-btn" id="btn-copy" disabled title="קאפירן (Ctrl+C)">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    קאפירן
                </button>
                <button class="tool-btn" id="btn-cut" disabled title="אַרויסשניידן (Ctrl+X)">
                    <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
                    אַרויסשניידן
                </button>
                <button class="tool-btn" id="btn-paste" disabled title="אַריינלייגן (Ctrl+V)">
                    <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                    אַריינלייגן
                </button>
                <button class="tool-btn danger" id="btn-delete" disabled title="אויסמעקן (Delete)">
                    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    אויסמעקן <span class="tool-kbd">Del</span>
                </button>
                <div class="toolbar-spacer"></div>
                <button class="tool-btn" id="btn-refresh" title="ריפרעש">
                    <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </button>
                <div class="search-box">
                    <input type="text" id="search" placeholder="זוכן..." autocomplete="off">
                    <span class="search-ic">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                </div>
            </div>

            <div class="selbar" id="selbar"></div>

            <div class="folders" id="folders"></div>

            <div class="list-head">
                <span class="h-name">נאמען</span>
                <span class="h-size">גרייס</span>
                <span class="h-act"></span>
            </div>
            <div id="file-list">
                <div id="list-spacer"><div id="list-rows"></div></div>
            </div>

            <div class="statusbar" id="statusbar"></div>
        </div>
    </div>

    <input type="file" id="file-input" multiple hidden>

    <!-- Upload / operation progress -->
    <div id="progress-panel">
        <div class="pp-head">
            <div class="pp-title" id="pp-title">אַרויפלייגן...</div>
            <button class="pp-close" id="pp-close" title="פארמאך">✕</button>
        </div>
        <div class="pp-list" id="pp-list"></div>
        <div class="pp-foot" id="pp-foot"></div>
    </div>

    <script>
    'use strict';
    // ─────────────────────────────────────────────────────────────
    //  Config
    //  MANAGE_API must point at the management Worker (see manage/worker.js
    //  and manage/README.md). Override for testing with ?api=... or by
    //  setting localStorage 'manage_api'.
    // ─────────────────────────────────────────────────────────────
    const MANAGE_API = (new URLSearchParams(location.search).get('api'))
        || localStorage.getItem('manage_api')
        || 'https://manage-api.oitzerhanigunim.org';

    const PIN = 'music@koiolos.org';

    // ── PIN gate (asked every visit; never stored) ──
    const pinForm = document.getElementById('pin-form');
    const pinInput = document.getElementById('pin-input');
    const pinErr = document.getElementById('pin-err');
    let _appStarted = false;
    pinForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (pinInput.value === PIN) {
            document.getElementById('pin-overlay').remove();
            document.getElementById('app').hidden = false;
            if (!_appStarted) { _appStarted = true; initApp(); }
        } else {
            pinErr.textContent = 'פאלשער PIN — פרובירט נאכאמאל';
            const box = pinForm; box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
            pinInput.value = ''; pinInput.focus();
        }
    });

    // ─────────────────────────────────────────────────────────────
    //  State
    // ─────────────────────────────────────────────────────────────
    let currentPrefix = '';         // '' = bucket root; otherwise ends with '/'
    let folders = [];               // full prefixes ending with '/'
    let files = [];                 // {key, name, size, uploaded}
    let filtered = [];              // files after search
    const selected = new Set();     // selected file keys
    let anchorIndex = -1;           // for shift-range selection
    let clipboard = null;           // { mode:'copy'|'move', keys:[...] }
    let busy = false;

    const ROW_H = 46, OVERSCAN = 8;

    // ─────────────────────────────────────────────────────────────
    //  DOM
    // ─────────────────────────────────────────────────────────────
    const $ = (id) => document.getElementById(id);
    const listEl = $('file-list'), spacerEl = $('list-spacer'), rowsEl = $('list-rows');
    const fileInput = $('file-input');

    // ─────────────────────────────────────────────────────────────
    //  Helpers
    // ─────────────────────────────────────────────────────────────
    function escHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtSize(n){
        if (n == null || isNaN(n)) return '';
        if (n < 1024) return n + ' B';
        if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
        if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
        return (n/1073741824).toFixed(2) + ' GB';
    }
    function joinKey(prefix, name){ return (prefix || '') + name; }
    function baseName(key){ const k = key.replace(/\/+$/,''); return k.slice(k.lastIndexOf('/') + 1); }

    async function api(path, opts){
        const r = await fetch(MANAGE_API + path, opts);
        let data = null;
        try { data = await r.json(); } catch(_) {}
        if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
        return data;
    }

    // ─────────────────────────────────────────────────────────────
    //  Rendering
    // ─────────────────────────────────────────────────────────────
    function renderBreadcrumb(){
        const bc = $('breadcrumb');
        const parts = currentPrefix ? currentPrefix.replace(/\/$/,'').split('/') : [];
        let html = `<button class="crumb${parts.length===0?' current':''}" data-prefix="">🏠 שורש</button>`;
        let acc = '';
        parts.forEach((p, i) => {
            acc += p + '/';
            const isLast = i === parts.length - 1;
            html += `<span class="crumb-sep">/</span><button class="crumb${isLast?' current':''}" data-prefix="${escHtml(acc)}">${escHtml(p)}</button>`;
        });
        bc.innerHTML = html;
    }

    function renderFolders(){
        const el = $('folders');
        if (!folders.length) { el.innerHTML = ''; return; }
        el.innerHTML = folders.map(f => {
            const name = baseName(f);
            return `<div class="folder-chip" data-prefix="${escHtml(f)}" title="${escHtml(name)}">
                <span class="fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></span>
                <span>${escHtml(name)}</span>
                <button class="folder-del" data-delfolder="${escHtml(f)}" title="אויסמעקן פאלדער">✕</button>
            </div>`;
        }).join('');
    }

    function renderList(){
        spacerEl.style.height = (filtered.length * ROW_H) + 'px';
        const scrollTop = listEl.scrollTop, vh = listEl.clientHeight;
        const start = Math.max(0, Math.floor(scrollTop / ROW_H) - OVERSCAN);
        const end = Math.min(filtered.length, Math.ceil((scrollTop + vh) / ROW_H) + OVERSCAN);
        let html = '';
        for (let i = start; i < end; i++){
            const f = filtered[i];
            const sel = selected.has(f.key);
            html += `<div class="frow${sel?' selected':''}" style="top:${i*ROW_H}px" data-i="${i}">
                <span class="fcheck">${sel?'✓':''}</span>
                <span class="fname" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
                <span class="fsize">${fmtSize(f.size)}</span>
                <button class="frow-del" data-del="1" title="אויסמעקן">✕</button>
            </div>`;
        }
        rowsEl.innerHTML = html;
        if (!filtered.length){
            rowsEl.innerHTML = `<div class="empty-state">קיין פיילס אין דעם פאלדער
                <small>ציט אַהער פיילס, אדער דרוקט "אַרויפלייגן"</small></div>`;
        }
    }

    function renderAll(){ renderBreadcrumb(); renderFolders(); renderList(); updateSelBar(); }

    function updateSelBar(){
        const n = selected.size;
        $('btn-delete').disabled = n === 0;
        $('btn-copy').disabled = n === 0;
        $('btn-cut').disabled = n === 0;
        $('btn-paste').disabled = !clipboard || !clipboard.keys.length;
        let html = '';
        if (n > 0) html += `<span class="count">${n} סעלעקטירט</span>`;
        else html += `<span class="muted">${filtered.length} פייל${filtered.length===1?'':'ס'}${filtered.length!==files.length?` (פון ${files.length})`:''}</span>`;
        if (clipboard && clipboard.keys.length){
            html += `<span class="clip">📋 <b>${clipboard.keys.length}</b> ${clipboard.mode==='move'?'צו באוועגן':'צו קאפירן'}</span>`;
        }
        $('selbar').innerHTML = html;
    }

    // ─────────────────────────────────────────────────────────────
    //  Data
    // ─────────────────────────────────────────────────────────────
    function setBusy(b, msg){
        busy = b;
        const sb = $('statusbar');
        if (b) sb.innerHTML = `<span class="spinner"></span><span class="busy">${escHtml(msg||'לאודט...')}</span>`;
        else if (sb.querySelector('.busy')) sb.innerHTML = '';
    }
    function setError(msg){
        const sb = $('statusbar');
        if (!msg) { if (sb.querySelector('.err')) sb.innerHTML=''; return; }
        sb.innerHTML = `<span class="err">⚠ ${escHtml(msg)}</span>`;
    }

    async function refresh(){
        setBusy(true, 'לאודט פאלדער...');
        try {
            const data = await api('/list?prefix=' + encodeURIComponent(currentPrefix));
            folders = (data.folders || []).sort((a,b)=>baseName(a).localeCompare(baseName(b),'he'));
            files = (data.files || []).sort((a,b)=>a.name.localeCompare(b.name,'he'));
            applyFilter(false);
            renderAll();
            setBusy(false); setError('');
        } catch(e){
            setBusy(false);
            setError('פראבלעם מיטן פארבינדן צום סערווער: ' + e.message);
            folders = []; files = []; filtered = [];
            renderAll();
            maybeConfigHint(e);
        }
    }

    function maybeConfigHint(e){
        // Show a one-time hint if the API host is still the placeholder.
        if (document.querySelector('.config-note')) return;
        if (MANAGE_API.indexOf('manage-api.oitzerhanigunim.org') !== -1){
            const note = document.createElement('div');
            note.className = 'config-note';
            note.innerHTML = 'דער <code>MANAGE_API</code> Worker איז נאכנישט קאנעקטירט. זעט <code>manage/README.md</code> פארן דעפּלוי, אדער טעסט מיט <code>?api=https://…</code>.';
            $('statusbar').after(note);
        }
    }

    function applyFilter(resetScroll){
        const q = $('search').value.trim().toLowerCase();
        filtered = q ? files.filter(f => f.name.toLowerCase().includes(q)) : files.slice();
        // Drop selections no longer visible in the filtered set? keep them; they still act on real keys.
        if (resetScroll !== false) listEl.scrollTop = 0;
        renderList(); updateSelBar();
    }

    // ─────────────────────────────────────────────────────────────
    //  Navigation
    // ─────────────────────────────────────────────────────────────
    function navigate(prefix){
        currentPrefix = prefix || '';
        selected.clear(); anchorIndex = -1;
        $('search').value = '';
        refresh();
    }

    // ─────────────────────────────────────────────────────────────
    //  Selection
    // ─────────────────────────────────────────────────────────────
    function toggleSelectAll(){
        if (selected.size === filtered.length && filtered.length > 0) selected.clear();
        else { selected.clear(); filtered.forEach(f => selected.add(f.key)); }
        renderList(); updateSelBar();
    }
    function clearSelection(){ selected.clear(); anchorIndex = -1; renderList(); updateSelBar(); }

    listEl.addEventListener('click', (e) => {
        const delBtn = e.target.closest('[data-del]');
        const row = e.target.closest('.frow');
        if (delBtn && row){ const f = filtered[+row.dataset.i]; if (f) deleteKeys([f.key]); return; }
        if (!row) return;
        const i = +row.dataset.i;
        const key = filtered[i].key;
        if (e.shiftKey && anchorIndex >= 0){
            const a = Math.min(i, anchorIndex), b = Math.max(i, anchorIndex);
            if (!(e.ctrlKey || e.metaKey)) selected.clear();
            for (let j = a; j <= b; j++) selected.add(filtered[j].key);
        } else if (e.ctrlKey || e.metaKey){
            if (selected.has(key)) selected.delete(key); else selected.add(key);
            anchorIndex = i;
        } else {
            selected.clear(); selected.add(key); anchorIndex = i;
        }
        renderList(); updateSelBar();
    });

    // Double-click opens/downloads the file (preview) in a new tab.
    listEl.addEventListener('dblclick', (e) => {
        const row = e.target.closest('.frow'); if (!row) return;
        const f = filtered[+row.dataset.i]; if (!f) return;
        window.open(MANAGE_API + '/object?key=' + encodeURIComponent(f.key), '_blank');
    });

    // ─────────────────────────────────────────────────────────────
    //  Folder clicks (navigate / delete)
    // ─────────────────────────────────────────────────────────────
    $('folders').addEventListener('click', (e) => {
        const del = e.target.closest('[data-delfolder]');
        if (del){ e.stopPropagation(); deleteFolder(del.getAttribute('data-delfolder')); return; }
        const chip = e.target.closest('[data-prefix]');
        if (chip) navigate(chip.getAttribute('data-prefix'));
    });
    $('breadcrumb').addEventListener('click', (e) => {
        const crumb = e.target.closest('[data-prefix]');
        if (crumb && !crumb.classList.contains('current')) navigate(crumb.getAttribute('data-prefix'));
    });

    // ─────────────────────────────────────────────────────────────
    //  Operations: delete / copy / cut / paste / new folder
    // ─────────────────────────────────────────────────────────────
    async function deleteKeys(keys){
        if (!keys.length || busy) return;
        const msg = keys.length === 1
            ? `אויסמעקן "${baseName(keys[0])}"?`
            : `אויסמעקן ${keys.length} פיילס?`;
        if (!confirm(msg + '\nמען קען דאס נישט צוריקדרייען.')) return;
        setBusy(true, 'מעקט אויס...');
        try {
            await api('/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ keys }) });
            keys.forEach(k => selected.delete(k));
            await refresh();
        } catch(e){ setBusy(false); setError('קען נישט אויסמעקן: ' + e.message); }
    }

    async function deleteFolder(prefix){
        if (busy) return;
        if (!confirm(`אויסמעקן דעם גאנצן פאלדער "${baseName(prefix)}" מיט אלע פיילס און אונטער-פאלדערס?\nמען קען דאס נישט צוריקדרייען.`)) return;
        setBusy(true, 'מעקט אויס פאלדער...');
        try {
            await api('/deletePrefix', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ prefix }) });
            await refresh();
        } catch(e){ setBusy(false); setError('קען נישט אויסמעקן פאלדער: ' + e.message); }
    }

    function copySelection(mode){
        if (!selected.size) return;
        clipboard = { mode, keys: [...selected] };
        updateSelBar();
    }

    async function paste(){
        if (!clipboard || !clipboard.keys.length || busy) return;
        const ep = clipboard.mode === 'move' ? '/move' : '/copy';
        setBusy(true, clipboard.mode === 'move' ? 'באוועגט...' : 'קאפירט...');
        try {
            await api(ep, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ from: clipboard.keys, toPrefix: currentPrefix }) });
            if (clipboard.mode === 'move') clipboard = null;
            selected.clear();
            await refresh();
        } catch(e){ setBusy(false); setError('קען נישט ' + (clipboard && clipboard.mode==='move'?'באוועגן':'קאפירן') + ': ' + e.message); }
    }

    async function newFolder(){
        if (busy) return;
        const name = prompt('נאמען פונעם נייעם פאלדער:');
        if (!name) return;
        const clean = name.trim().replace(/^\/+|\/+$/g,'');
        if (!clean) return;
        setBusy(true, 'שאפט פאלדער...');
        try {
            await api('/mkdir', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ prefix: joinKey(currentPrefix, clean) + '/' }) });
            await refresh();
        } catch(e){ setBusy(false); setError('קען נישט שאפן פאלדער: ' + e.message); }
    }

    // ─────────────────────────────────────────────────────────────
    //  Uploads — streamed, concurrency-limited, with progress.
    //  Files are sent as the XHR body (browser streams from disk), so
    //  large files and many files won't blow up memory or freeze the UI.
    // ─────────────────────────────────────────────────────────────
    let _uploadBatch = null;
    const CONCURRENCY = 3;

    function uploadFiles(fileList){
        const list = [...fileList].filter(f => f.size !== undefined);
        if (!list.length) return;
        const items = list.map(f => ({ file: f, key: joinKey(currentPrefix, f.name), pct: 0, status: 'queued' }));
        _uploadBatch = { items, targetPrefix: currentPrefix, done: 0, failed: 0 };
        showProgress();
        let idx = 0, active = 0;
        return new Promise((resolve) => {
            const pump = () => {
                if (idx >= items.length && active === 0){ finishBatch(); resolve(); return; }
                while (active < CONCURRENCY && idx < items.length){
                    const it = items[idx++]; active++;
                    uploadOne(it).then(() => { active--; pump(); });
                }
            };
            pump();
        });
    }

    function uploadOne(it){
        return new Promise((resolve) => {
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', MANAGE_API + '/object?key=' + encodeURIComponent(it.key));
            xhr.setRequestHeader('Content-Type', it.file.type || 'application/octet-stream');
            it.status = 'uploading';
            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable){ it.pct = Math.round(e.loaded / e.total * 100); scheduleProgressRender(); }
            };
            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300){ it.status = 'done'; it.pct = 100; _uploadBatch.done++; }
                else { it.status = 'error'; it.err = 'HTTP ' + xhr.status; _uploadBatch.failed++; }
                scheduleProgressRender(); resolve();
            };
            xhr.onerror = () => { it.status = 'error'; it.err = 'network'; _uploadBatch.failed++; scheduleProgressRender(); resolve(); };
            try { xhr.send(it.file); }
            catch(e){ it.status = 'error'; it.err = String(e); _uploadBatch.failed++; scheduleProgressRender(); resolve(); }
        });
    }

    async function finishBatch(){
        if (!_uploadBatch) return;
        const { done, failed, items, targetPrefix } = _uploadBatch;
        $('pp-title').textContent = failed ? `געענדיגט מיט ${failed} פראבלעמ${failed===1?'':'ען'}` : 'אלע אַרויפגעלייגט ✓';
        $('pp-foot').textContent = `${done}/${items.length} געלונגען`;
        // Only refresh if the user is still looking at the folder we uploaded to.
        if (targetPrefix === currentPrefix) await refresh();
    }

    // Progress panel rendering (throttled via rAF)
    let _ppScheduled = false;
    function scheduleProgressRender(){ if (_ppScheduled) return; _ppScheduled = true; requestAnimationFrame(() => { _ppScheduled = false; renderProgress(); }); }
    function showProgress(){ $('progress-panel').classList.add('show'); $('pp-title').textContent = 'אַרויפלייגן...'; renderProgress(); }
    function renderProgress(){
        if (!_uploadBatch) return;
        const { items, done, failed } = _uploadBatch;
        $('pp-foot').textContent = `${done + failed}/${items.length}`;
        // Render at most a window of items to stay light with huge batches.
        const active = items.filter(i => i.status === 'uploading' || i.status === 'queued');
        const recentDone = items.filter(i => i.status !== 'uploading' && i.status !== 'queued').slice(-40);
        const show = active.slice(0, 40).concat(recentDone).slice(-60);
        $('pp-list').innerHTML = show.map(it => `
            <div class="pp-item ${it.status==='done'?'done':it.status==='error'?'error':''}">
                <div class="pp-name"><span>${escHtml(it.file.name)}</span><span class="pp-pct">${it.status==='error'?(it.err||'פעלער'):it.pct+'%'}</span></div>
                <div class="pp-bar"><div class="pp-fill" style="width:${it.pct}%"></div></div>
            </div>`).join('');
    }
    $('pp-close').addEventListener('click', () => $('progress-panel').classList.remove('show'));

    // ─────────────────────────────────────────────────────────────
    //  Drag & drop upload
    // ─────────────────────────────────────────────────────────────
    ['dragenter','dragover'].forEach(ev => listEl.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); listEl.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(ev => listEl.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); if (ev==='dragleave' && listEl.contains(e.relatedTarget)) return; listEl.classList.remove('dragover'); }));
    listEl.addEventListener('drop', (e) => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });
    // Prevent the browser from navigating away if a file is dropped elsewhere.
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => { if (e.target.closest('#file-list')) return; e.preventDefault(); });

    // ─────────────────────────────────────────────────────────────
    //  Toolbar wiring
    // ─────────────────────────────────────────────────────────────
    $('btn-upload').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFiles(fileInput.files); fileInput.value = ''; });
    $('btn-newfolder').addEventListener('click', newFolder);
    $('btn-selectall').addEventListener('click', toggleSelectAll);
    $('btn-copy').addEventListener('click', () => copySelection('copy'));
    $('btn-cut').addEventListener('click', () => copySelection('move'));
    $('btn-paste').addEventListener('click', paste);
    $('btn-delete').addEventListener('click', () => deleteKeys([...selected]));
    $('btn-refresh').addEventListener('click', refresh);
    $('search').addEventListener('input', () => applyFilter(true));

    listEl.addEventListener('scroll', () => requestAnimationFrame(renderList), { passive: true });
    window.addEventListener('resize', () => requestAnimationFrame(renderList));

    // ─────────────────────────────────────────────────────────────
    //  Keyboard shortcuts
    // ─────────────────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
        if (document.getElementById('pin-overlay')) return;        // gated
        const t = e.target;
        const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
        const mod = e.ctrlKey || e.metaKey;

        if (mod && (e.key === 'a' || e.key === 'A')){ if (typing) return; e.preventDefault(); toggleSelectAll(); return; }
        if (typing){ if (e.key === 'Escape') t.blur(); return; }

        if (mod && (e.key === 'c' || e.key === 'C')){ e.preventDefault(); copySelection('copy'); }
        else if (mod && (e.key === 'x' || e.key === 'X')){ e.preventDefault(); copySelection('move'); }
        else if (mod && (e.key === 'v' || e.key === 'V')){ e.preventDefault(); paste(); }
        else if (e.key === 'Delete' || e.key === 'Backspace'){ if (selected.size){ e.preventDefault(); deleteKeys([...selected]); } }
        else if (e.key === 'Escape'){ clearSelection(); }
        else if (e.key === 'F2' || e.key === '/'){ e.preventDefault(); $('search').focus(); }
    });

    // ─────────────────────────────────────────────────────────────
    //  Init
    // ─────────────────────────────────────────────────────────────
    function initApp(){
        renderAll();
        refresh();
    }
    </script>
</body>
</html>
