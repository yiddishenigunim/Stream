<!DOCTYPE html>
<html lang="yi" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>File Manager — Chassidishe Nigunim</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18V5l12-2v13'></path><circle cx='6' cy='18' r='3'></circle><circle cx='18' cy='16' r='3'></circle></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold-light: #fbe6ad;
            --gold: #d4af37;
            --gold-dark: #aa841c;
            --navy-dark: #070e1b;
            --navy: #0e1d35;
            --navy-light: #182e50;
            --cream: #faf6eb;
            --glass-bg: rgba(14, 29, 53, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --danger: #e0556a;
            --ok: #43b581;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #050c18 0%, #0c182b 50%, #152744 100%);
            min-height: 100vh; color: var(--cream);
            overflow-x: hidden; position: relative;
        }

        /* The file-management chrome stays English / LTR; the replicated
           main-page view (header + cards + occasions) is Yiddish / RTL. */
        #manager-view, #progress-panel, .pin-box { direction: ltr; }

        /* Glowing background orbs — same as the main page */
        .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.12; mix-blend-mode: screen; animation: floatOrb 25s infinite alternate ease-in-out; }
        .orb-1 { width: 450px; height: 450px; background-color: var(--gold); top: -10%; left: -10%; animation-duration: 20s; }
        .orb-2 { width: 550px; height: 550px; background-color: #8b3a42; bottom: -15%; right: -10%; animation-duration: 28s; animation-delay: -5s; }
        .orb-3 { width: 350px; height: 350px; background-color: #4a3a6a; top: 45%; left: 50%; animation-duration: 25s; animation-delay: -10s; }
        @keyframes floatOrb { 0% { transform: translate(0,0) scale(1);} 50% { transform: translate(80px,-60px) scale(1.15);} 100% { transform: translate(-50px,70px) scale(0.9);} }

        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(circle at 50% 0%, rgba(212,175,55,0.05) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(114,47,55,0.05) 0%, transparent 60%);
        }

        .container { position: relative; z-index: 1; max-width: 950px; margin: 0 auto; padding: 0 18px 40px; min-height: 100vh; display: flex; flex-direction: column; }

        /* Header — mirrors the main page */
        .header { padding: 40px 10px 24px; text-align: center; }
        .header h1 {
            font-size: 3em; font-weight: 700; letter-spacing: 1px; font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #ffffff 10%, var(--gold-light) 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
        }
        .header .subtitle { font-size: 1.1em; color: var(--cream); opacity: 0.75; margin-top: 6px; }
        .header::after { content: ''; display: block; margin: 18px auto 0; width: 150px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent); opacity: 0.5; }

        /* ── Category view (looks like the main page) ── */
        .main-section { display: flex; flex-direction: column; align-items: center; width: 100%; }

        .category-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; width: 100%; margin-bottom: 26px; }

        .category-btn {
            aspect-ratio: 1 / 1.05; border-radius: 20px; border: 1px solid var(--glass-border); cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            font-weight: 700; font-family: inherit; position: relative; overflow: hidden;
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            color: var(--cream); box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .category-btn::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 70%); opacity: 0; transition: opacity 0.4s; }
        .category-btn:hover::before { opacity: 1; }
        .category-btn:hover { transform: translateY(-8px) scale(1.03); border-color: rgba(212,175,55,0.45); box-shadow: 0 15px 35px rgba(0,0,0,0.35), 0 0 25px rgba(212,175,55,0.15); }
        .category-btn:active { transform: translateY(-2px) scale(0.98); }

        .btn-marshn { background: linear-gradient(135deg, rgba(235,110,60,0.35), rgba(135,50,20,0.55)); }
        .btn-lebedik { background: linear-gradient(135deg, rgba(160,35,75,0.35), rgba(85,15,40,0.55)); }
        .btn-shteyt { background: linear-gradient(135deg, rgba(95,50,175,0.35), rgba(40,18,90,0.55)); }
        .btn-music { background: linear-gradient(135deg, rgba(40,130,95,0.35), rgba(15,60,40,0.55)); }
        .btn-vocali { background: linear-gradient(135deg, rgba(55,145,175,0.35), rgba(20,70,90,0.55)); }

        .play-icon { display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45)); transition: transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275), color 0.3s; color: var(--gold-light); }
        .play-icon svg { width: 38px; height: 38px; stroke: currentColor; }
        .category-btn:hover .play-icon { transform: scale(1.15); color: var(--gold); }
        .category-label { letter-spacing: 0.5px; font-size: 0.9em; font-family: 'Heebo', sans-serif; font-weight: 700; line-height: 1.3; min-height: 2.6em; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 6px; }

        /* Moadim section */
        .moadim-section { width: 100%; margin: 4px 0 15px; text-align: center; background: rgba(255,255,255,0.02); border-radius: 24px; padding: 20px 25px; border: 1px solid rgba(255,255,255,0.03); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
        .moadim-title { color: var(--gold-light); font-size: 1.25em; margin-bottom: 15px; font-weight: 700; letter-spacing: 0.5px; font-family: 'Heebo', sans-serif; }
        .moadim-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .moadim-row-1, .moadim-row-2 { margin-bottom: 12px; }
        .moadim-btn { padding: 9px 20px; border-radius: 30px; border: 1px solid var(--glass-border); background: var(--glass-bg); cursor: pointer; font-size: 0.95em; font-weight: 500; font-family: inherit; color: var(--cream); transition: all 0.4s cubic-bezier(0.16,1,0.3,1); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .moadim-btn:hover { border-color: rgba(212,175,55,0.35); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); background: rgba(255,255,255,0.08); }

        /* Bein HaMetzarim — highlighted like on the main page */
        .moadim-btn.btn-beinhametzarim { position: relative; overflow: visible; color: #fff; font-weight: 700; border-color: var(--gold); background: linear-gradient(135deg, rgba(212,175,55,0.35), rgba(139,58,66,0.45)); box-shadow: 0 4px 15px rgba(0,0,0,0.2), 0 0 16px rgba(212,175,55,0.35); animation: newStreamPulse 1.7s cubic-bezier(0.4,0,0.6,1) infinite; }
        .moadim-btn.btn-beinhametzarim::before { content: ''; position: absolute; inset: -3px; border-radius: 32px; border: 2px solid var(--gold); opacity: 0; pointer-events: none; animation: newStreamRing 1.7s ease-out infinite; }
        .moadim-btn.btn-beinhametzarim:hover { transform: translateY(-3px) scale(1.04); border-color: var(--gold-light); box-shadow: 0 8px 26px rgba(0,0,0,0.3), 0 0 30px rgba(212,175,55,0.6); }
        @keyframes newStreamPulse { 0%,100% { border-color: rgba(212,175,55,0.7); box-shadow: 0 4px 15px rgba(0,0,0,0.2), 0 0 12px rgba(212,175,55,0.3);} 50% { border-color: var(--gold-light); box-shadow: 0 6px 22px rgba(0,0,0,0.28), 0 0 34px rgba(212,175,55,0.75);} }
        @keyframes newStreamRing { 0% { transform: scale(1); opacity: 0.7;} 70%,100% { transform: scale(1.14); opacity: 0;} }
        @media (prefers-reduced-motion: reduce) { .moadim-btn.btn-beinhametzarim, .moadim-btn.btn-beinhametzarim::before { animation: none; } }

        /* ── Manager view ── */
        .panel { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 22px; box-shadow: 0 12px 40px rgba(0,0,0,0.28); padding: 18px 20px; }

        .mv-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
        .back-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--cream); font-family: inherit; font-size: 0.92em; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .back-btn:hover { border-color: rgba(212,175,55,0.4); background: rgba(255,255,255,0.09); }
        .mv-title { font-size: 1.35em; font-weight: 700; color: var(--gold-light); font-family: 'Heebo', sans-serif; }

        .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 1em; margin-bottom: 6px; }
        .crumb { background: none; border: none; color: var(--gold-light); cursor: pointer; font-family: inherit; font-size: 1em; padding: 4px 8px; border-radius: 10px; transition: background 0.2s; font-weight: 600; }
        .crumb:hover { background: rgba(255,255,255,0.06); }
        .crumb.current { color: var(--cream); cursor: default; }
        .crumb-sep { opacity: 0.45; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
        .tool-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--cream); font-family: inherit; font-size: 0.92em; font-weight: 600; cursor: pointer; transition: all 0.2s cubic-bezier(0.16,1,0.3,1); }
        .tool-btn:hover:not(:disabled) { border-color: rgba(212,175,55,0.4); background: rgba(255,255,255,0.09); transform: translateY(-2px); }
        .tool-btn:active:not(:disabled) { transform: translateY(0); }
        .tool-btn:disabled { opacity: 0.38; cursor: not-allowed; }
        .tool-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .tool-btn.primary { border-color: var(--gold); background: linear-gradient(135deg, rgba(212,175,55,0.28), rgba(212,175,55,0.08)); color: var(--gold-light); }
        .tool-btn.danger { color: #ffd7dd; }
        .tool-btn.danger:hover:not(:disabled) { border-color: var(--danger); background: rgba(224,85,106,0.16); }
        .tool-kbd { font-size: 0.72em; opacity: 0.55; }
        .toolbar-spacer { flex: 1 1 auto; }

        .search-box { position: relative; display: flex; align-items: center; }
        .search-box input { background: rgba(0,0,0,0.25); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--cream); font-family: inherit; font-size: 0.92em; padding: 9px 34px 9px 14px; width: 190px; transition: border-color 0.2s, width 0.2s; }
        .search-box input:focus { outline: none; border-color: rgba(212,175,55,0.5); width: 220px; }
        .search-box .search-ic { position: absolute; right: 11px; opacity: 0.5; pointer-events: none; }

        .selbar { display: flex; align-items: center; gap: 14px; margin-top: 14px; font-size: 0.92em; min-height: 22px; flex-wrap: wrap; }
        .selbar .count { color: var(--gold-light); font-weight: 700; }
        .selbar .clip b { color: var(--gold-light); }
        .selbar .muted { opacity: 0.6; }

        .folders { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .folder-chip { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.035); cursor: pointer; transition: all 0.2s cubic-bezier(0.16,1,0.3,1); font-size: 0.95em; font-weight: 600; color: var(--cream); position: relative; }
        .folder-chip:hover { border-color: rgba(212,175,55,0.4); background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .folder-chip .fi { color: var(--gold); display: flex; }
        .folder-chip .fi svg { width: 20px; height: 20px; }

        .list-head { display: flex; align-items: center; gap: 12px; padding: 6px 14px; margin-top: 14px; font-size: 0.8em; opacity: 0.6; letter-spacing: 0.5px; text-transform: uppercase; }
        .list-head .h-name { flex: 1; }
        .list-head .h-size { width: 90px; }
        .list-head .h-level { width: 82px; }
        .list-head .h-act { width: 34px; }

        #file-list { position: relative; margin-top: 4px; height: 52vh; min-height: 240px; overflow-y: auto; overflow-x: hidden; border: 1px solid var(--glass-border); border-radius: 16px; background: rgba(0,0,0,0.18); }
        #file-list.dragover { border-color: var(--gold); background: rgba(212,175,55,0.10); }
        #list-spacer { position: relative; width: 100%; }
        #list-rows { position: absolute; inset: 0; }

        .frow { position: absolute; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 14px; cursor: pointer; user-select: none; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .frow:hover { background: rgba(255,255,255,0.045); }
        .frow.selected { background: rgba(212,175,55,0.15); }
        .frow.selected:hover { background: rgba(212,175,55,0.2); }
        .fcheck { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 0.8em; color: var(--navy-dark); flex: 0 0 auto; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
        .fcheck:hover { border-color: var(--gold); }
        .frow.selected .fcheck { background: var(--gold); border-color: var(--gold); }
        .fico { width: 18px; flex: 0 0 auto; text-align: center; font-size: 0.72em; color: var(--gold-light); opacity: 0; transition: opacity 0.15s; }
        .frow:hover .fico { opacity: 0.65; }
        .frow.playing .fico { opacity: 1; color: var(--gold); }
        .frow.playing { background: rgba(212,175,55,0.12); }
        .frow.playing .fname { color: var(--gold-light); font-weight: 600; }
        .fname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.96em; direction: rtl; text-align: left; }
        .fsize { width: 90px; font-size: 0.82em; opacity: 0.65; }
        .flevel { width: 82px; font-size: 0.8em; opacity: 0.65; font-variant-numeric: tabular-nums; }
        .flevel.none { opacity: 0.3; }
        .frow-del { width: 26px; height: 26px; border-radius: 8px; border: none; background: rgba(255,255,255,0.05); color: #ffb3bd; cursor: pointer; font-size: 0.85em; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; opacity: 0; transition: opacity 0.15s, background 0.15s; }
        .frow:hover .frow-del { opacity: 1; }
        .frow-del:hover { background: var(--danger); color: #fff; }

        .empty-state { padding: 46px 20px; text-align: center; opacity: 0.55; font-size: 1.05em; }
        .empty-state small { display: block; margin-top: 8px; opacity: 0.8; font-size: 0.8em; }

        .statusbar { margin-top: 12px; min-height: 20px; font-size: 0.9em; display: flex; align-items: center; gap: 10px; }
        .statusbar .err { color: #ffb3bd; }
        .statusbar .busy { color: var(--gold-light); }
        .spinner { width: 15px; height: 15px; border: 2px solid rgba(212,175,55,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Upload progress panel */
        #progress-panel { position: fixed; right: 20px; bottom: 20px; width: min(360px, calc(100vw - 40px)); background: rgba(10,20,38,0.94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--glass-border); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,0.55); z-index: 50; padding: 14px 16px; display: none; }
        #progress-panel.show { display: block; }
        .pp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .pp-title { font-weight: 700; color: var(--gold-light); font-size: 0.98em; }
        .pp-close { background: none; border: none; color: var(--cream); opacity: 0.6; cursor: pointer; font-size: 1.1em; }
        .pp-close:hover { opacity: 1; }
        .pp-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .pp-item { font-size: 0.82em; }
        .pp-item .pp-name { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
        .pp-item .pp-name span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
        .pp-item .pp-pct { opacity: 0.7; flex: 0 0 auto; }
        .pp-bar { height: 5px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
        .pp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold-dark), var(--gold-light)); transition: width 0.15s; }
        .pp-item.done .pp-fill { background: linear-gradient(90deg, #2f7d5b, var(--ok)); }
        .pp-item.error .pp-fill { background: linear-gradient(90deg, #8b2b38, var(--danger)); width: 100% !important; }
        .pp-item.error .pp-pct { color: #ffb3bd; }
        .pp-foot { margin-top: 10px; font-size: 0.8em; opacity: 0.75; text-align: center; }
        .pp-stop { margin-left: 10px; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: var(--cream); border-radius: 8px; padding: 3px 10px; font-family: inherit; font-size: 1em; cursor: pointer; }
        .pp-stop:hover { border-color: var(--danger); }

        /* PIN overlay */
        #pin-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(5,12,24,0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .pin-box { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(212,175,55,0.35); border-radius: 24px; padding: 36px 40px; text-align: center; width: 380px; max-width: 90vw; box-shadow: 0 20px 55px rgba(0,0,0,0.55), 0 0 30px rgba(212,175,55,0.18); }
        .pin-box .lock { color: var(--gold); margin-bottom: 12px; }
        .pin-box h2 { color: var(--gold-light); font-size: 1.4em; margin-bottom: 6px; font-family: 'Heebo', sans-serif; }
        .pin-box p { opacity: 0.72; font-size: 0.95em; margin-bottom: 20px; }
        .pin-box input { width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: var(--cream); font-family: inherit; font-size: 1.05em; text-align: center; }
        .pin-box input:focus { outline: none; border-color: var(--gold); }
        .pin-box button { margin-top: 16px; width: 100%; padding: 13px; border: none; border-radius: 14px; cursor: pointer; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--navy-dark); font-family: inherit; font-size: 1.05em; font-weight: 700; transition: transform 0.2s, box-shadow 0.2s; }
        .pin-box button:hover { transform: scale(1.03); box-shadow: 0 6px 20px rgba(212,175,55,0.35); }
        .pin-err { color: #ffb3bd; font-size: 0.9em; margin-top: 12px; min-height: 18px; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-9px);} 40%,80%{transform:translateX(9px);} }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.4em; }
            .category-buttons { display: flex; flex-wrap: wrap; justify-content: center; }
            .category-btn { flex: 0 0 calc(33.333% - 12px); min-width: 100px; max-width: 220px; aspect-ratio: 1 / 1.05; }
        }
        @media (max-width: 620px) {
            .header h1 { font-size: 2em; }
            .search-box, .search-box input, .search-box input:focus { width: 100%; flex: 1 1 100%; }
            .toolbar-spacer { display: none; }
            .fsize, .flevel, .list-head .h-level { display: none; }
            .category-btn { flex: 0 0 calc(50% - 8px); }
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- PIN gate — asked on every visit -->
    <div id="pin-overlay">
        <form class="pin-box" id="pin-form" autocomplete="off">
            <div class="lock">
                <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2>File Manager</h2>
            <p>Enter the PIN to continue</p>
            <input type="password" id="pin-input" placeholder="PIN" autocomplete="off" autofocus>
            <button type="submit">Enter</button>
            <div class="pin-err" id="pin-err"></div>

    <script>
    'use strict';
    // ─────────────────────────────────────────────────────────────
    //  Config — the management endpoints live in the existing
    //  nigunim-api worker (same host the stream uses). See manage/worker.js.
    //  Override for testing with ?api=... or localStorage 'manage_api'.
    // ─────────────────────────────────────────────────────────────
    const MANAGE_API = (new URLSearchParams(location.search).get('api'))
        || localStorage.getItem('manage_api')
        || 'https://stream-api.oitzerhanigunim.org';

    const PIN = 'music@koilos.org';

    // Category → folder (matches the main page's FOLDERS). Time-based ones
    // (vocali) point at their parent so both subfolders are manageable.
    const CATEGORY_FOLDERS = {
        marshn: 'שיינע מארשן',
        lebedik: 'לעבעדיג',
        shteyt: 'שטייטע',
        music: 'בלויז מוזיק',
        vocali: 'מועדים וזמנים/ספירה',
        shabbos: 'מועדים וזמנים/ניגוני שבק',
        motzeishabbos: 'מועדים וזמנים/מוצאי שב_ק',
        roshchodesh: 'מועדים וזמנים/ראש חודש',
        yomimnoroim: 'מועדים וזמנים/ימים נוראים',
        sukkos: 'מועדים וזמנים/סוכות',
        chanukah: 'מועדים וזמנים/חנוכה',
        purim: 'מועדים וזמנים/פורים',
        pesach: 'מועדים וזמנים/פסח',
        lagbomer: 'מועדים וזמנים/ל_ג בעומר',
        shavuos: 'מועדים וזמנים/שבועות',
        beinhametzarim: 'מועדים וזמנים/בין המצרים'
    };
    const CATEGORY_LABELS = {
        marshn: 'אלגעמיינע קאלעקשאן', lebedik: 'לעבעדיגע ניגונים', shteyt: 'שטאטע ניגונים',
        music: 'בלויז מוזיק', vocali: 'וואקאליש', shabbos: 'שבת קודש', motzeishabbos: 'מוצאי שבת',
        roshchodesh: 'ראש חודש', yomimnoroim: 'ימים נוראים', sukkos: 'סוכות', chanukah: 'חנוכה',
        purim: 'פורים', pesach: 'פסח', lagbomer: 'ל״ג בעומר', shavuos: 'שבועות', beinhametzarim: 'בין המצרים'
    };

    // ── PIN gate (asked every visit; never stored) ──
    const pinForm = document.getElementById('pin-form');
    const pinInput = document.getElementById('pin-input');
    const pinErr = document.getElementById('pin-err');
    let _appStarted = false;
    pinForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (pinInput.value === PIN) {
            document.getElementById('pin-overlay').remove();
            document.getElementById('app').hidden = false;
            if (!_appStarted) { _appStarted = true; }
        } else {
            pinErr.textContent = 'Wrong PIN — try again';
            pinForm.classList.remove('shake'); void pinForm.offsetWidth; pinForm.classList.add('shake');
            pinInput.value = ''; pinInput.focus();
        }
    });

    // ── State ──
    let categoryRoot = '';   // folder for the open category, ends with '/'
    let categoryLabel = '';
    let currentPrefix = '';   // current folder (>= categoryRoot), ends with '/'
    let folders = [], files = [], filtered = [];
    const selected = new Set();
    let anchorIndex = -1;
    let busy = false;

    const ROW_H = 46, OVERSCAN = 8;
    const $ = (id) => document.getElementById(id);
    const listEl = $('file-list'), spacerEl = $('list-spacer'), rowsEl = $('list-rows');
    const fileInput = $('file-input');

    // ── Helpers ──
    function escHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtSize(n){
        if (n == null || isNaN(n)) return '';
        if (n < 1024) return n + ' B';
        if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
        if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
        return (n/1073741824).toFixed(2) + ' GB';
    }
    function joinKey(prefix, name){ return (prefix || '') + name; }
    const AUDIO_RE = /\.(mp3|wav|ogg|m4a|flac|aac|wma)$/i;
    function baseName(key){ const k = key.replace(/\/+$/,''); return k.slice(k.lastIndexOf('/') + 1); }

    async function api(path, opts){
        const r = await fetch(MANAGE_API + path, opts);
        let data = null; try { data = await r.json(); } catch(_) {}
        if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
        return data;
    }

    // ── View switching ──
    function openManager(category){
        const folder = CATEGORY_FOLDERS[category];
        if (folder == null) return;
        categoryRoot = folder.replace(/\/?$/, '/');
        categoryLabel = CATEGORY_LABELS[category] || category;
        currentPrefix = categoryRoot;
        selected.clear(); anchorIndex = -1;
        $('search').value = '';
        $('category-view').hidden = true;
        $('manager-view').hidden = false;
        $('mv-title').textContent = categoryLabel;
        refresh();
    }
    window.openManager = openManager;

    function backToCategories(){
        stopPreview();
        $('manager-view').hidden = true;
        $('category-view').hidden = false;
        selected.clear();
    }
    function stopPreview(){ try { previewAudio.pause(); } catch(_){} playingKey = null; }

    // ── Rendering ──
    function renderBreadcrumb(){
        const rel = currentPrefix.slice(categoryRoot.length);
        const parts = rel ? rel.replace(/\/$/,'').split('/') : [];
        let html = `<button class="crumb${parts.length===0?' current':''}" data-prefix="${escHtml(categoryRoot)}">${escHtml(categoryLabel)}</button>`;
        let acc = categoryRoot;
        parts.forEach((p, i) => {
            acc += p + '/';
            const isLast = i === parts.length - 1;
            html += `<span class="crumb-sep">/</span><button class="crumb${isLast?' current':''}" data-prefix="${escHtml(acc)}">${escHtml(p)}</button>`;
        });
        $('breadcrumb').innerHTML = html;
    }

    function renderFolders(){
        const el = $('folders');
        if (!folders.length) { el.innerHTML = ''; return; }
        el.innerHTML = folders.map(f => `<div class="folder-chip" data-prefix="${escHtml(f)}" title="${escHtml(baseName(f))}">
            <span class="fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></span>
            <span>${escHtml(baseName(f))}</span>
        </div>`).join('');
    }

    function renderList(){
        spacerEl.style.height = (filtered.length * ROW_H) + 'px';
        const scrollTop = listEl.scrollTop, vh = listEl.clientHeight;
        const start = Math.max(0, Math.floor(scrollTop / ROW_H) - OVERSCAN);
        const end = Math.min(filtered.length, Math.ceil((scrollTop + vh) / ROW_H) + OVERSCAN);
        if (!filtered.length){
            rowsEl.innerHTML = `<div class="empty-state">No files in this folder<small>Drag files here, or click Upload</small></div>`;
            return;
        }
        let html = '';
        for (let i = start; i < end; i++){
            const f = filtered[i], sel = selected.has(f.key);
            const playing = f.key === playingKey && !previewAudio.paused;
            html += `<div class="frow${sel?' selected':''}${playing?' playing':''}" style="top:${i*ROW_H}px" data-i="${i}">
                <span class="fcheck" data-check="1" title="Select">${sel?'✓':''}</span>
                <span class="fico">${playing?'⏸':'▶'}</span>
                <span class="fname" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
                ${levelCell(f)}
                <span class="fsize">${fmtSize(f.size)}</span>
                <button class="frow-del" data-del="1" title="Delete">✕</button>
            </div>`;
        }
        rowsEl.innerHTML = html;
    }

    function renderAll(){ renderBreadcrumb(); renderFolders(); renderList(); updateSelBar(); }

    function updateSelBar(){
        const n = selected.size;
        $('btn-delete').disabled = n === 0;
        let html = '';
        if (n > 0) html += `<span class="count">${n} selected</span>`;
        else html += `<span class="muted">${filtered.length} file${filtered.length===1?'':'s'}${filtered.length!==files.length?` (of ${files.length})`:''}</span>`;
        $('selbar').innerHTML = html;
    }

    // ── Data ──
    function setBusy(b, msg){
        busy = b;
        const sb = $('statusbar');
        if (b) sb.innerHTML = `<span class="spinner"></span><span class="busy">${escHtml(msg||'Loading...')}</span>`;
        else if (sb.querySelector('.busy')) sb.innerHTML = '';
    }
    function setError(msg){
        const sb = $('statusbar');
        if (!msg) { if (sb.querySelector('.err')) sb.innerHTML=''; return; }
        sb.innerHTML = `<span class="err">⚠ ${escHtml(msg)}</span>`;
    }

    async function refresh(){
        setBusy(true, 'Loading folder...');
        try {
            const data = await api('/list?prefix=' + encodeURIComponent(currentPrefix));
            folders = (data.folders || []).sort((a,b)=>baseName(a).localeCompare(baseName(b)));
            files = (data.files || []).sort((a,b)=>a.name.localeCompare(b.name));
            applyFilter(false);
            renderAll();
            setBusy(false); setError('');
        } catch(e){
            setBusy(false);
            setError("Couldn't connect to the server: " + e.message);
            folders = []; files = []; filtered = [];
            renderAll();
        }
    }

    function applyFilter(resetScroll){
        const q = $('search').value.trim().toLowerCase();
        filtered = q ? files.filter(f => f.name.toLowerCase().includes(q)) : files.slice();
        if (resetScroll !== false) listEl.scrollTop = 0;
        renderList(); updateSelBar();
    }

    function navigate(prefix){
        stopPreview();
        currentPrefix = prefix || categoryRoot;
        selected.clear(); anchorIndex = -1;
        $('search').value = '';
        refresh();
    }

    // ── Selection ──
    function toggleSelectAll(){
        if (selected.size === filtered.length && filtered.length > 0) selected.clear();
        else { selected.clear(); filtered.forEach(f => selected.add(f.key)); }
        renderList(); updateSelBar();
    }
    function clearSelection(){ selected.clear(); anchorIndex = -1; renderList(); updateSelBar(); }

    listEl.addEventListener('click', (e) => {
        const row = e.target.closest('.frow'); if (!row) return;
        const i = +row.dataset.i, f = filtered[i];
        if (e.target.closest('[data-del]')){ deleteKeys([f.key]); return; }
        // Only the checkbox selects (with shift-range support).
        if (e.target.closest('[data-check]')){
            if (e.shiftKey && anchorIndex >= 0){
                const a = Math.min(i, anchorIndex), b = Math.max(i, anchorIndex);
                for (let j = a; j <= b; j++) selected.add(filtered[j].key);
            } else {
                if (selected.has(f.key)) selected.delete(f.key); else selected.add(f.key);
                anchorIndex = i;
            }
            renderList(); updateSelBar(); return;
        }
        // Clicking anywhere else on the row plays / pauses the file.
        playFile(f);
    });

    // ── Inline preview playback ──
    let playingKey = null;
    const previewAudio = new Audio();
    previewAudio.addEventListener('ended', () => { playingKey = null; renderList(); });
    previewAudio.addEventListener('pause', () => renderList());
    previewAudio.addEventListener('play', () => renderList());
    function playFile(f){
        if (playingKey === f.key){
            if (previewAudio.paused) previewAudio.play().catch(()=>{});
            else previewAudio.pause();
            return;
        }
        playingKey = f.key;
        previewAudio.src = MANAGE_API + '/object?key=' + encodeURIComponent(f.key);
        previewAudio.play().catch(()=>{});
        renderList();
    }

    $('folders').addEventListener('click', (e) => {
        const chip = e.target.closest('[data-prefix]');
        if (chip) navigate(chip.getAttribute('data-prefix'));
    });
    $('breadcrumb').addEventListener('click', (e) => {
        const crumb = e.target.closest('[data-prefix]');
        if (crumb && !crumb.classList.contains('current')) navigate(crumb.getAttribute('data-prefix'));
    });

    // ── Even volume ──
    // Every file's loudness is measured here, in the browser (a Worker has
    // no audio decoder), and stored on the R2 object. The worker turns that
    // into a per-file correction to one target level: /radio applies it up
    // or down, the website turns loud files down. A new upload is measured
    // before it is sent; "Even volume" measures everything already there.

    // BS.1770-4 integrated loudness (LUFS) and sample peak (dBFS) of decoded
    // audio — the same measurement as the main site's audio scan. K-weighting
    // is two biquads with coefficients worked out from the sample rate (the
    // 48 kHz table is off on a 44.1 kHz file); 400 ms blocks with 75%
    // overlap; gates at -70 LUFS absolute and -10 LU relative. It streams
    // through each channel once, keeping only 100 ms energies, so it needs
    // no copy of the audio: a long track is big enough in memory already.
    function measureLoudness(channels, sr){
        const hop = Math.round(sr * 0.1), nHops = Math.floor(channels[0].length / hop);
        if (nHops < 4) return null;
        let K = Math.tan(Math.PI * 1681.974450955533 / sr), Q = 0.7071752369554196;
        const Vh = Math.pow(10, 3.999843853973347 / 20), Vb = Math.pow(Vh, 0.4996667741545416);
        let d = 1 + K / Q + K * K;
        const b0 = (Vh + Vb * K / Q + K * K) / d, b1 = 2 * (K * K - Vh) / d, b2 = (Vh - Vb * K / Q + K * K) / d;
        const a1 = 2 * (K * K - 1) / d, a2 = (1 - K / Q + K * K) / d;
        K = Math.tan(Math.PI * 38.13547087602444 / sr); Q = 0.5003270373238773;
        d = 1 + K / Q + K * K;
        const c1 = 2 * (K * K - 1) / d, c2 = (1 - K / Q + K * K) / d;   // high-pass, b = [1, -2, 1]
        const energy = new Float64Array(nHops);
        let peak = 0;
        for (const x of channels){
            let x1 = 0, x2 = 0, y1 = 0, y2 = 0, z1 = 0, z2 = 0;
            for (let h = 0, i = 0; h < nHops; h++){
                let acc = 0;
                for (const end = i + hop; i < end; i++){
                    const v = x[i];
                    if (v > peak) peak = v; else if (-v > peak) peak = -v;
                    const y = b0 * v + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
                    const z = y - 2 * y1 + y2 - c1 * z1 - c2 * z2;
                    x2 = x1; x1 = v; y2 = y1; y1 = y; z2 = z1; z1 = z;
                    acc += z * z;
                }
                energy[h] += acc;
            }
        }
        const nBlocks = nHops - 3, z = new Float64Array(nBlocks);
        for (let b = 0; b < nBlocks; b++) z[b] = (energy[b] + energy[b + 1] + energy[b + 2] + energy[b + 3]) / (4 * hop);
        const level = (e) => -0.691 + 10 * Math.log10(e);
        const gated = (min) => { let s = 0, c = 0; for (const e of z) if (e > 0 && level(e) > min) { s += e; c++; } return c ? s / c : 0; };
        const abs = gated(-70);
        if (!abs) return null;
        const rel = gated(level(abs) - 10);
        return { lufs: +level(rel).toFixed(2), peak: +(20 * Math.log10(Math.max(peak, 1e-6))).toFixed(2) };
    }

    // Files above this aren't decoded at all (an hour of audio is ~1.5 GB
    // once decoded); above MEASURE_HALF_RATE they're decoded at 22.05 kHz,
    // which halves that and moves LUFS by < 0.1 dB. Resampling can shave a
    // peak, so those get a dB of extra room — the peak caps how far /radio
    // may raise a file without clipping.
    const MEASURE_MAX_BYTES = 120e6, MEASURE_HALF_RATE = 30e6;

    // One decode at a time: uploads run 3 in parallel, and three decoded
    // tracks at once is a lot of memory for nothing.
    let _measureChain = Promise.resolve();
    function measureBytes(getBuffer, size){
        const run = async () => {
            if (size > MEASURE_MAX_BYTES) return null;
            const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            if (!AC) return null;
            const half = size > MEASURE_HALF_RATE;
            const audio = await new AC(1, 1, half ? 22050 : 44100).decodeAudioData(await getBuffer());
            const chans = [];
            for (let c = 0; c < Math.min(2, audio.numberOfChannels); c++) chans.push(audio.getChannelData(c));
            const r = measureLoudness(chans, audio.sampleRate);
            if (r && half) r.peak = +(r.peak + 1).toFixed(2);
            return r;
        };
        const p = _measureChain.then(run, run);
        _measureChain = p.catch(() => {});
        return p;
    }

    function levelCell(f){
        if (f.lufs == null) return `<span class="flevel none" title="Not measured yet — click Even volume">—</span>`;
        const g = f.gain || 0, corr = g === 0 ? '±0' : (g > 0 ? '+' : '−') + Math.abs(g).toFixed(1);
        const tip = `${f.lufs.toFixed(1)} LUFS, peak ${f.peak.toFixed(1)} dBFS. Correction ${corr} dB on /radio; the website only turns loud files down.`;
        return `<span class="flevel" title="${escHtml(tip)}">${f.lufs.toFixed(1)} LUFS</span>`;
    }

    // Every file in the bucket, folder by folder (the /list route is one level).
    async function listAllFiles(prefix, out){
        out = out || [];
        const data = await api('/list?prefix=' + encodeURIComponent(prefix));
        out.push(...(data.files || []));
        for (const f of (data.folders || [])) await listAllFiles(f, out);
        return out;
    }

    let _levelJob = null;
    const LEVEL_CONCURRENCY = 2;
    async function evenVolume(){
        if ((_uploadBatch && !_uploadBatch.finished) || (_levelJob && !_levelJob.finished)){ alert('Wait for the current job to finish first.'); return; }
        if (!confirm('Measure the loudness of every file that hasn\'t been measured yet, in all folders?\n\n' +
            'Each file is downloaded and measured in this browser, so keep this tab open. It can be stopped and continued later — measured files are skipped.')) return;
        const job = _levelJob = _job = { kind: 'level', items: [], done: 0, failed: 0, stop: false, finished: false, started: Date.now() };
        showProgress('Finding files...');
        let all;
        try { all = await listAllFiles(''); }
        catch(e){ job.finished = true; $('pp-title').textContent = "Couldn't list files: " + e.message; return; }
        const todo = all.filter(f => AUDIO_RE.test(f.key) && f.lufs == null);
        job.measuredBefore = all.length - todo.length;
        if (!todo.length){
            job.finished = true;
            $('pp-title').textContent = `All ${all.length} files are measured ✓`;
            $('pp-foot').textContent = 'New uploads are measured automatically.';
            return;
        }
        job.items = todo.map(f => ({ key: f.key, name: f.name, size: f.size, pct: 0, status: 'queued' }));
        $('pp-title').textContent = 'Measuring loudness...';
        renderProgress();
        let idx = 0;
        const worker = async () => { while (!job.stop && idx < job.items.length) await levelOne(job, job.items[idx++]); };
        await Promise.all(Array.from({ length: LEVEL_CONCURRENCY }, worker));
        job.finished = true;
        renderProgress();
        $('pp-title').textContent = job.stop ? 'Stopped — click Even volume to continue'
            : job.failed ? `Done with ${job.failed} problem${job.failed===1?'':'s'}` : 'Every file measured ✓';
        await refresh();
    }

    async function levelOne(job, it){
        for (let attempt = 0; ; attempt++){
            try {
                it.status = 'reading'; it.pct = 15; scheduleProgressRender();
                if (it.size > MEASURE_MAX_BYTES){ const e = new Error('too large to measure'); e.fatal = true; throw e; }
                const r = await fetch(MANAGE_API + '/object?key=' + encodeURIComponent(it.key));
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const buf = await r.arrayBuffer();
                it.status = 'measuring'; it.pct = 50; scheduleProgressRender();
                let loud;
                try { loud = await measureBytes(() => buf, buf.byteLength); } catch(_) { loud = null; }
                if (!loud){ const e = new Error("couldn't decode"); e.fatal = true; throw e; }
                it.status = 'saving'; it.pct = 80; scheduleProgressRender();
                await api('/loudness', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: it.key, lufs: loud.lufs, peak: loud.peak }) });
                it.status = 'done'; it.pct = 100; it.note = loud.lufs.toFixed(1) + ' LUFS';
                job.done++; scheduleProgressRender();
                return;
            } catch(e){
                if (e.fatal || attempt >= 2 || job.stop){
                    it.status = 'error'; it.err = e.message; job.failed++; scheduleProgressRender();
                    return;
                }
                it.status = 'retry'; scheduleProgressRender();
                await new Promise(r => setTimeout(r, 1500 * Math.pow(2, attempt)));
            }
        }
    }

    // ── Operations ──
    async function deleteKeys(keys){
        if (!keys.length || busy) return;
        const msg = keys.length === 1 ? `Delete "${baseName(keys[0])}"?` : `Delete ${keys.length} files?`;
        if (!confirm(msg + "\nThis can't be undone.")) return;
        setBusy(true, 'Deleting...');
        try {
            await api('/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ keys }) });
            keys.forEach(k => selected.delete(k));
            await refresh();
        } catch(e){ setBusy(false); setError("Couldn't delete: " + e.message); }
    }
    // ── Uploads — streamed, concurrency-limited, with progress ──
    let _uploadBatch = null;
    const CONCURRENCY = 3;
    const MAX_UPLOAD_RETRIES = 5;   // ride out transient blocks (e.g. Cloudflare)
    function uploadFiles(fileList){
        const list = [...fileList].filter(f => f.size !== undefined);
        if (!list.length) return;
        const items = list.map(f => ({ file: f, key: joinKey(currentPrefix, f.name), pct: 0, status: 'queued' }));
        if (_levelJob && !_levelJob.finished){ alert('Wait for Even volume to finish (or stop it) before uploading.'); return; }
        _uploadBatch = _job = { items, targetPrefix: currentPrefix, done: 0, failed: 0, finished: false };
        showProgress('Uploading...');
        let idx = 0, active = 0;
        return new Promise((resolve) => {
            const pump = () => {
                if (idx >= items.length && active === 0){ finishBatch(); resolve(); return; }
                while (active < CONCURRENCY && idx < items.length){
                    const it = items[idx++]; active++;
                    measureUpload(it).then(() => uploadOne(it)).then(() => { active--; pump(); });
                }
            };
            pump();
        });
    }
    // Measured once, before the first attempt — a retry reuses the number.
    async function measureUpload(it){
        it.loud = null;
        if (!AUDIO_RE.test(it.file.name)) return;
        it.status = 'measuring'; scheduleProgressRender();
        try { it.loud = await measureBytes(() => it.file.arrayBuffer(), it.file.size); } catch(_) { it.loud = null; }
    }
    function uploadOne(it, attempt){
        attempt = attempt || 0;
        return new Promise((resolve) => {
            const retry = (why) => {
                if (attempt < MAX_UPLOAD_RETRIES){
                    // Exponential backoff with jitter — gives a throttling edge
                    // (Cloudflare Bot Fight Mode, rate limits) time to recover.
                    const delay = Math.min(15000, 700 * Math.pow(2, attempt)) + Math.random() * 500;
                    it.status = 'retry'; it.pct = 0; it.err = why; scheduleProgressRender();
                    setTimeout(() => uploadOne(it, attempt + 1).then(resolve), delay);
                } else {
                    it.status = 'error'; it.err = why; _uploadBatch.failed++; scheduleProgressRender(); resolve();
                }
            };
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', MANAGE_API + '/object?key=' + encodeURIComponent(it.key));
            xhr.setRequestHeader('Content-Type', it.file.type || 'application/octet-stream');
            if (it.loud){
                xhr.setRequestHeader('X-Loudness-Lufs', String(it.loud.lufs));
                xhr.setRequestHeader('X-Loudness-Peak', String(it.loud.peak));
            }
            it.status = 'uploading';
            xhr.upload.onprogress = (e) => { if (e.lengthComputable){ it.pct = Math.round(e.loaded / e.total * 100); scheduleProgressRender(); } };
            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300){ it.status = 'done'; it.pct = 100; _uploadBatch.done++; scheduleProgressRender(); resolve(); }
                else if (xhr.status === 429 || xhr.status === 403 || xhr.status >= 500){ retry('HTTP ' + xhr.status); }
                else { it.status = 'error'; it.err = 'HTTP ' + xhr.status; _uploadBatch.failed++; scheduleProgressRender(); resolve(); }
            };
            xhr.onerror = () => retry('network');       // CORS-blocked / dropped requests land here
            xhr.ontimeout = () => retry('timeout');
            try { xhr.send(it.file); } catch(e){ retry(String(e)); }
        });
    }
    async function finishBatch(){
        if (!_uploadBatch) return;
        const { done, failed, items, targetPrefix } = _uploadBatch;
        _uploadBatch.finished = true;
        $('pp-title').textContent = failed ? `Done with ${failed} problem${failed===1?'':'s'}` : 'All uploaded ✓';
        $('pp-foot').textContent = `${done}/${items.length} succeeded`;
        if (targetPrefix === currentPrefix) await refresh();
    }
    let _ppScheduled = false;
    function scheduleProgressRender(){ if (_ppScheduled) return; _ppScheduled = true; requestAnimationFrame(() => { _ppScheduled = false; renderProgress(); }); }
    let _job = null;   // whichever of the upload batch / Even volume pass the panel shows
    function showProgress(title){ $('progress-panel').classList.add('show'); $('pp-title').textContent = title; $('pp-list').innerHTML = ''; $('pp-foot').textContent = ''; renderProgress(); }
    function renderProgress(){
        if (!_job) return;
        const { items, done, failed } = _job;
        if (_job.kind === 'level'){
            const n = done + failed, left = items.length - n;
            const secs = n ? (Date.now() - _job.started) / 1000 / n * left : 0;
            const eta = n && left ? ` · ~${secs < 90 ? Math.ceil(secs) + ' s' : Math.ceil(secs / 60) + ' min'} left` : '';
            $('pp-foot').innerHTML = `${n}/${items.length}${eta}` +
                (_job.finished ? '' : `<button class="pp-stop" id="pp-stop">${_job.stop ? 'Stopping…' : 'Stop'}</button>`);
        } else {
            $('pp-foot').textContent = `${done + failed}/${items.length}`;
        }
        const inProgress = (s) => !(s === 'done' || s === 'error');
        const active = items.filter(i => inProgress(i.status));
        const finished = items.filter(i => !inProgress(i.status)).slice(-40);
        const show = active.slice(0, 40).concat(finished).slice(-60);
        const pct = (it) => it.status === 'error' ? (it.err || 'error')
            : it.status === 'retry' ? '↻ retry'
            : it.status === 'measuring' ? 'measuring…'
            : it.status === 'reading' ? 'reading…'
            : it.status === 'saving' ? 'saving…'
            : it.note || it.pct + '%';
        $('pp-list').innerHTML = show.map(it => `
            <div class="pp-item ${it.status==='done'?'done':it.status==='error'?'error':''}">
                <div class="pp-name"><span>${escHtml(it.name || it.file.name)}</span><span class="pp-pct">${pct(it)}</span></div>
                <div class="pp-bar"><div class="pp-fill" style="width:${it.pct}%"></div></div>
            </div>`).join('');
    }
    $('pp-close').addEventListener('click', () => $('progress-panel').classList.remove('show'));
    $('pp-foot').addEventListener('click', (e) => {
        if (e.target.id === 'pp-stop' && _levelJob && !_levelJob.finished){ _levelJob.stop = true; renderProgress(); }
    });

    // ── Drag & drop ──
    ['dragenter','dragover'].forEach(ev => listEl.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); listEl.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(ev => listEl.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); if (ev==='dragleave' && listEl.contains(e.relatedTarget)) return; listEl.classList.remove('dragover'); }));
    listEl.addEventListener('drop', (e) => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => { if (e.target.closest('#file-list')) return; e.preventDefault(); });

    // ── Toolbar wiring ──
    $('btn-back').addEventListener('click', backToCategories);
    $('btn-upload').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFiles(fileInput.files); fileInput.value = ''; });
    $('btn-selectall').addEventListener('click', toggleSelectAll);
    $('btn-delete').addEventListener('click', () => deleteKeys([...selected]));
    $('btn-refresh').addEventListener('click', refresh);
    $('btn-level').addEventListener('click', evenVolume);
    $('search').addEventListener('input', () => applyFilter(true));
    listEl.addEventListener('scroll', () => requestAnimationFrame(renderList), { passive: true });
    window.addEventListener('resize', () => requestAnimationFrame(renderList));

    // ── Keyboard shortcuts (only while the manager view is open) ──
    document.addEventListener('keydown', (e) => {
        if (document.getElementById('pin-overlay')) return;
        if ($('manager-view').hidden) return;
        const t = e.target;
        const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
        const mod = e.ctrlKey || e.metaKey;
        if (mod && (e.key === 'a' || e.key === 'A')){ if (typing) return; e.preventDefault(); toggleSelectAll(); return; }
        if (typing){ if (e.key === 'Escape') t.blur(); return; }
        if (e.key === 'Delete' || e.key === 'Backspace'){ if (selected.size){ e.preventDefault(); deleteKeys([...selected]); } }
        else if (e.key === 'Escape'){ if (selected.size) clearSelection(); else backToCategories(); }
        else if (e.key === 'F2' || e.key === '/'){ e.preventDefault(); $('search').focus(); }
    });
    </script>
</body>
</html>
